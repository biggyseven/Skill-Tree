name: Exam regression tests

on:
  push:
    branches:
      - feature/lab-workspace
      - fix/exam-neon-safe-20261027
  pull_request:
    branches:
      - feature/lab-workspace
      - security/site-hardening-20261027

permissions:
  contents: read

jobs:
  exam-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt httpx

      - name: Compile application modules
        run: python -m compileall -q app

      - name: Run exam API regression tests
        run: python -m unittest discover -s tests -p "test_exam_api.py" -v
