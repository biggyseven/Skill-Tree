name: Production overlay and cloud labs smoke

on:
  push:
    branches:
      - feature/lab-workspace
    paths:
      - labs_v2/**
      - .github/workflows/production-overlay-cloud-labs-smoke.yml
      - tests/test_lab_routes.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  overlay-and-cloud-labs:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SKILLTREE_PRODUCTION_SMOKE_PASSWORD: ${{ secrets.SKILLTREE_PRODUCTION_SMOKE_PASSWORD }}
    steps:
      - name: Wait for deployed scenarios to appear in the catalog
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request
          import sys
          sys.path.insert(0, "tests")
          from production_smoke_auth import authenticated_opener

          base = "https://skill-tree-vjon.onrender.com"
          opener = authenticated_opener(base)
          expected = [
              "vxlan-intermediaire",
              "vxlan-expert",
              "sd-wan-intermediaire",
              "sd-wan-expert",
              "segment-routing-intermediaire",
              "segment-routing-expert",
              "aws-vpc-intermediaire",
              "aws-vpc-expert",
              "azure-vnet-intermediaire",
              "azure-vnet-expert",
              "cloud-aws-intermediaire",
              "cloud-azure-intermediaire",
              "cloud-gcp-intermediaire",
          ]
          last_error = "catalog is still on an older deployment"
          for _ in range(36):
              try:
                  with opener.open(base + "/openapi.json", timeout=20) as response:
                      if response.status != 200:
                          raise RuntimeError(f"OpenAPI returned HTTP {response.status}")
                  with opener.open(base + "/api/lab/v2", timeout=25) as response:
                      catalog = json.loads(response.read().decode("utf-8"))
                  ids = {
                      item.get("id")
                      for item in catalog
                      if isinstance(item, dict) and isinstance(item.get("id"), str)
                  }
                  missing = sorted(set(expected) - ids)
                  if not missing:
                      print("OVERLAY_CLOUD_LABS_IN_CATALOG=13")
                      break
                  last_error = "labs not yet exposed: " + ", ".join(missing)
              except Exception as error:
                  last_error = str(error)
              time.sleep(5)
          else:
              raise SystemExit("Production catalog did not catch up with deploy: " + last_error)
          PY

      - name: Check the topology and automated grading for each overlay/cloud lab
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request
          import sys
          sys.path.insert(0, "tests")
          from production_smoke_auth import authenticated_opener

          base = "https://skill-tree-vjon.onrender.com"
          opener = authenticated_opener(base)
          expected = [
              "vxlan-intermediaire",
              "vxlan-expert",
              "sd-wan-intermediaire",
              "sd-wan-expert",
              "segment-routing-intermediaire",
              "segment-routing-expert",
              "aws-vpc-intermediaire",
              "aws-vpc-expert",
              "azure-vnet-intermediaire",
              "azure-vnet-expert",
              "cloud-aws-intermediaire",
              "cloud-azure-intermediaire",
              "cloud-gcp-intermediaire",
          ]

          for lab_id in expected:
              request = urllib.request.Request(
                  base + "/api/lab/v2/" + lab_id,
                  headers={"Accept": "application/json"},
              )
              try:
                  with opener.open(request, timeout=30) as response:
                      payload = json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as error:
                  detail = error.read().decode("utf-8", errors="replace")
                  raise SystemExit(f"{lab_id}: HTTP {error.code}: {detail[:500]}") from error

              topology = payload.get("initial_topology") or {}
              definition = payload.get("definition") or {}
              check = definition.get("check") or {}
              nodes = topology.get("nodes") or []
              links = topology.get("links") or []
              rules = check.get("rules") or []
              if (
                  payload.get("id") != lab_id
                  or payload.get("sandbox") is True
                  or len(nodes) < 2
                  or len(links) < 1
                  or check.get("type") != "config_assertions"
                  or len(rules) < 3
              ):
                  raise SystemExit(
                      f"{lab_id}: scenario is not playable/gradeable: "
                      + json.dumps(
                          {"id": payload.get("id"), "sandbox": payload.get("sandbox"),
                           "equipment": len(nodes), "cables": len(links),
                           "check_type": check.get("type"), "rules": len(rules)},
                          ensure_ascii=False,
                      )
                  )
              node_map = {node.get("id"): node for node in nodes}
              used_ports = set()
              for link in links:
                  for endpoint in (link.get("from") or {}, link.get("to") or {}):
                      node = node_map.get(endpoint.get("node"))
                      if node is None or not any(
                          port.get("id") == endpoint.get("port")
                          for port in node.get("ports", [])
                      ):
                          raise SystemExit(f"{lab_id}: invalid endpoint on link {link.get('id')}")
                      key = (endpoint.get("node"), endpoint.get("port"))
                      if key in used_ports:
                          raise SystemExit(f"{lab_id}: endpoint port used by more than one link: {key}")
                      used_ports.add(key)
              print(
                  f"PLAYABLE_LAB={lab_id} EQUIPMENT={len(nodes)} "
                  f"CABLES={len(links)} RULES={len(rules)}"
              )

          print("OVERLAY_CLOUD_PRODUCTION_CHECK=passed")
          PY
