name: Browser UI regressions

on:
  pull_request:
    branches: ["main", "feature/lab-workspace"]
    paths:
      - "static/**"
      - "app/**"
      - "content/**"
      - "tests/e2e/**"
      - "requirements.txt"
      - ".github/workflows/browser-ui-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install application dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Playwright test runner
        run: npm install --prefix tests/e2e --no-audit --no-fund

      - name: Install Chromium and OS dependencies
        run: tests/e2e/node_modules/.bin/playwright install --with-deps chromium

      - name: Run browser UI regression suite
        run: npm --prefix tests/e2e test

      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-ui-test-results
          path: tests/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
