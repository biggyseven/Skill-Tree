name: Build main Skill Tree stylesheet

on:
  push:
    branches:
      - feature/lab-workspace
      - perf/compiled-tailwind-main-20261028
      - perf/main-assets-cache-20261028
      - perf/local-alpine-js-20261028
      - perf/local-alpine-final-20261028
    paths:
      - "static/index.html"
      - "static/tailwind.config.cjs"
      - "static/tailwind.input.css"
      - ".github/workflows/build-main-stylesheet.yml"

permissions:
  contents: write

jobs:
  build-main-stylesheet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/lab-workspace/package-lock.json

      - name: Install locked dependencies
        run: npm ci --prefix app/lab-workspace --no-audit --no-fund

      - name: Compile main app stylesheet
        run: ./app/lab-workspace/node_modules/.bin/tailwindcss --config ./static/tailwind.config.cjs --input ./static/tailwind.input.css --output ./static/app.css --minify

      - name: Vendor pinned Alpine.js runtime
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$(mktemp -d)"
          npm pack alpinejs@3.17.5 --pack-destination "$package_dir" >/dev/null
          tar -xzf "$package_dir/alpinejs-3.17.5.tgz" -C "$package_dir"
          install -D "$package_dir/package/dist/cdn.min.js" static/assets/alpine-3.17.5.min.js
          curl --fail --silent --show-error --retry 3 \
            "https://raw.githubusercontent.com/alpinejs/alpine/v3.17.5/LICENSE.md" \
            -o static/assets/alpinejs-LICENSE.md
          asset_hash="$(sha256sum static/assets/alpine-3.17.5.min.js | cut -c1-12)"
          if grep -q 'ALPINE_VENDOR_HASH' static/index.html; then
            sed -i "s/ALPINE_VENDOR_HASH/$asset_hash/g" static/index.html
          fi

      - name: Commit compiled stylesheet and pinned vendor asset when changed
        shell: bash
        run: |
          git add -A static/app.css static/assets/alpine-3.17.5.min.js static/assets/alpinejs-LICENSE.md static/index.html
          if git diff --cached --quiet -- static/app.css static/assets/alpine-3.17.5.min.js static/assets/alpinejs-LICENSE.md static/index.html; then
            echo "FRONTEND_ASSETS=unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(frontend): refresh compiled Tailwind stylesheet"
          for attempt in 1 2 3; do
            git fetch origin "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              echo "Could not rebase generated assets onto the latest branch." >&2
              exit 1
            fi
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push raced with another asset build (attempt ${attempt}/3); retrying." >&2
          done
          exit 1
