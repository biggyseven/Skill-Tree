<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="color-scheme" content="light dark">
  <title>Connexion · Skill-Tree</title>
  <style>
    :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at top, #253b59 0%, #101827 55%, #0b1120 100%); color: #f8fafc; }
    main { width: min(100%, 440px); padding: clamp(24px, 6vw, 38px); border: 1px solid #36465d; border-radius: 22px; background: rgba(15, 23, 42, .94); box-shadow: 0 24px 90px rgba(0,0,0,.28); }
    .mark { display: grid; place-items: center; width: 54px; height: 54px; margin-bottom: 24px; border-radius: 16px; background: #244d82; font-size: 25px; }
    h1 { margin: 0 0 9px; font-size: clamp(27px, 5vw, 34px); letter-spacing: -.04em; }
    p { color: #b8c4d5; line-height: 1.55; }
    label { display: block; margin: 24px 0 8px; font-size: 14px; font-weight: 650; color: #e2e8f0; }
    input { width: 100%; padding: 13px 14px; border: 1px solid #475569; border-radius: 11px; background: #0b1220; color: white; font: inherit; }
    input:focus { outline: 3px solid rgba(96,165,250,.35); border-color: #60a5fa; }
    button { width: 100%; border: 0; margin-top: 17px; padding: 13px 16px; border-radius: 11px; background: #60a5fa; color: #0b1322; font: inherit; font-weight: 750; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    #message { min-height: 23px; margin-top: 15px; font-size: 14px; color: #fca5a5; }
    #setup { display: none; padding: 12px 14px; margin-top: 18px; border-radius: 10px; border: 1px solid #854d0e; background: #422006; color: #fde68a; font-size: 14px; line-height: 1.55; }
    footer { margin-top: 22px; font-size: 12px; color: #8493a9; text-align: center; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">🌳</div>
    <h1>Skill-Tree</h1>
    <p>Saisis le mot de passe de l’application pour ouvrir ton espace privé. Après connexion, tu reprendras directement la page demandée. Tu resteras connecté dans ce navigateur pendant 12 heures.</p>
    <div id="setup" role="alert"></div>
    <form id="login-form" autocomplete="on">
      <label for="password">Mot de passe de l'application</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024" autofocus>
      <button id="submit" type="submit">Se connecter</button>
    </form>
    <div id="message" role="status" aria-live="polite"></div>
    <footer>Session privée · Le mot de passe n'est jamais conservé dans le navigateur.</footer>
  </main>
  <script>
    (() => {
      const form = document.getElementById('login-form');
      const input = document.getElementById('password');
      const button = document.getElementById('submit');
      const message = document.getElementById('message');
      const setup = document.getElementById('setup');
      const showSetup = text => {
        setup.textContent = text;
        setup.style.display = 'block';
        form.style.display = 'none';
      };
      // Seules les destinations internes sont acceptées : le paramètre next ne peut
      // pas transformer la page de connexion en redirection ouverte vers un site tiers.
      const rawNext = new URLSearchParams(window.location.search).get('next');
      const nextPath = (() => {
        if (!rawNext || !rawNext.startsWith('/') || rawNext.startsWith('//') || rawNext.includes('\\')) return '/';
        try {
          const target = new URL(rawNext, window.location.origin);
          if (target.origin !== window.location.origin || target.pathname === '/login.html' || target.pathname.startsWith('/api/auth/')) return '/';
          return target.pathname + target.search + target.hash;
        } catch (_) {
          return '/';
        }
      })();
      const navigateToNext = () => window.location.replace(nextPath);
      fetch('/api/auth/status', { cache: 'no-store', credentials: 'same-origin' })
        .then(async response => {
          if (!response.ok) throw new Error('Le service de connexion ne répond pas correctement.');
          return response.json();
        })
        .then(status => {
          if (!status.required || status.authenticated) {
            navigateToNext();
            return;
          }
          if (!status.configured) {
            showSetup("La connexion sécurisée n'est pas encore configurée côté serveur. Définis SKILLTREE_AUTH_PASSWORD_HASH et SKILLTREE_AUTH_SECRET dans les variables d'environnement Render, puis redémarre le service.");
          }
        })
        .catch(error => { message.textContent = error.message || 'Connexion momentanément indisponible.'; });

      let redirecting = false;
      form.addEventListener('submit', async event => {
        event.preventDefault();
        message.textContent = '';
        button.disabled = true;
        button.textContent = 'Vérification…';
        try {
          const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            credentials: 'same-origin',
            cache: 'no-store',
            body: JSON.stringify({ password: input.value })
          });
          const result = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(result.detail || 'Échec de la connexion.');
          redirecting = true;
          input.value = '';
          input.disabled = true;
          button.textContent = 'Ouverture de la page demandée…';
          message.style.color = '#86efac';
          message.textContent = 'Connexion réussie. Ouverture de ton parcours…';
          navigateToNext();
        } catch (error) {
          message.textContent = error.message || 'Échec de la connexion.';
          input.select();
        } finally {
          if (!redirecting) {
            button.disabled = false;
            button.textContent = 'Se connecter';
          }
        }
      });
    })();
  </script>
</body>
</html>
