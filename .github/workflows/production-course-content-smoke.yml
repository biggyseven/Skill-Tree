name: Production lesson and quiz API smoke

on:
  push:
    branches: ["feature/lab-workspace"]
    paths:
      - ".github/workflows/production-course-content-smoke.yml"
      - "app/api.py"
      - "app/loader.py"
      - "content/nodes.json"
      - "content/lessons/**"
      - "content/quiz/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production-courses:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout catalogue
        uses: actions/checkout@v7

      - name: Verify production authentication and optional authenticated content
        shell: bash
        env:
          SKILLTREE_RUN_AUTHENTICATED_SMOKE: ${{ vars.SKILLTREE_RUN_AUTHENTICATED_SMOKE }}
          SKILLTREE_PRODUCTION_TEST_PASSWORD: ${{ secrets.SKILLTREE_PRODUCTION_TEST_PASSWORD }}
        run: |
          python - <<'PY'
          import http.cookiejar
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          BASE = "https://skill-tree-vjon.onrender.com"
          TARGETS = (
              "maint-communication-debutant",
              "maint-securite-base-debutant",
              "maint-procedures-intermediaire",
              "maint-reporting-incident-intermediaire",
              "maint-predictive-expert",
              "maint-audits-expert",
              "maint-fournisseurs-expert",
              "maint-retex-expert",
              "data-bigdata-expert",
              "data-streaming-expert",
              "data-datalake-expert",
              "data-securite-expert",
              "data-gouvernance-expert",
              "data-ingestion-expert",
          )
          DATA_EXPERTS = frozenset({
              "data-bigdata-expert",
              "data-streaming-expert",
              "data-datalake-expert",
              "data-securite-expert",
              "data-gouvernance-expert",
              "data-ingestion-expert",
          })
          RUN_AUTHENTICATED = os.environ.get("SKILLTREE_RUN_AUTHENTICATED_SMOKE", "").strip().lower() == "true"
          PASSWORD = os.environ.get("SKILLTREE_PRODUCTION_TEST_PASSWORD", "")
          nodes = json.loads(Path("content/nodes.json").read_text(encoding="utf-8-sig"))
          titles = {
              item["id"]: item["title"]
              for item in nodes
              if isinstance(item, dict)
              and isinstance(item.get("id"), str)
              and isinstance(item.get("title"), str)
          }
          missing_catalogue = sorted(set(TARGETS) - set(titles))
          if missing_catalogue:
              raise SystemExit(
                  "Target ids absent from the checked-out catalogue: "
                  + ", ".join(missing_catalogue)
              )

          class NonRetryableSmokeError(Exception):
              pass

          class TransientSmokeError(Exception):
              pass

          def fetch(opener, path, accept="application/json", method="GET", body=None):
              headers = {
                  "Accept": accept,
                  "User-Agent": "Skill-Tree-production-smoke",
              }
              data = None
              if body is not None:
                  data = json.dumps(body).encode("utf-8")
                  headers["Content-Type"] = "application/json"
              request = urllib.request.Request(BASE + path, data=data, headers=headers, method=method)
              try:
                  with opener.open(request, timeout=15) as response:
                      return response.status, response.read().decode("utf-8", errors="replace")
              except urllib.error.HTTPError as error:
                  return error.code, error.read().decode("utf-8", errors="replace")

          TRANSIENT_HTTP_CODES = {408, 425, 429, 500, 502, 503, 504}
          MAX_READINESS_ATTEMPTS = 18
          
          
          def check_status(status, expected, label, retry_transient=True):
              if status == expected:
                  return
              message = f"{label}: expected HTTP {expected}, received {status}"
              if retry_transient and status in TRANSIENT_HTTP_CODES:
                  raise TransientSmokeError(message)
              raise NonRetryableSmokeError(message)
          
          
          def parse_json_or_fail(body, label):
              try:
                  return json.loads(body)
              except json.JSONDecodeError as error:
                  raise NonRetryableSmokeError(f"{label}: invalid JSON response") from error
          
          
          def fetch_retry(opener, path, accept, expected_status, label, attempts=3):
              last_error = "no response"
              for attempt in range(1, attempts + 1):
                  try:
                      status, body = fetch(opener, path, accept)
                  except (urllib.error.URLError, TimeoutError, OSError) as error:
                      last_error = f"{type(error).__name__}: {error}"
                  else:
                      if status == expected_status:
                          return status, body
                      if status not in TRANSIENT_HTTP_CODES:
                          return status, body
                      last_error = f"HTTP {status}"
          
                  if attempt < attempts:
                      print(f"Transient request issue for {label}, attempt {attempt}/{attempts}: {last_error}")
                      time.sleep(3)
          
              raise NonRetryableSmokeError(
                  f"{label} did not recover after {attempts} request attempts: {last_error}"
              )
          
          
          def verify_readiness():
              anonymous = urllib.request.build_opener()
              status, _ = fetch(anonymous, "/openapi.json")
              check_status(status, 200, "OpenAPI readiness")
          
              status, auth_text = fetch(anonymous, "/api/auth/status")
              check_status(status, 200, "Authentication status")
              auth_status = parse_json_or_fail(auth_text, "Authentication status")
              if auth_status.get("required") is not True or auth_status.get("authenticated") is not False:
                  raise NonRetryableSmokeError(
                      "Production does not report the expected private, unauthenticated state"
                  )
              return anonymous
          
          
          # Retry only transient readiness/connectivity failures. Contract and content
          # failures are non-retryable so they are reported immediately rather than hidden
          # behind repeated full runs of the smoke test.
          last_error = "production did not respond"
          for attempt in range(1, MAX_READINESS_ATTEMPTS + 1):
              try:
                  anonymous = verify_readiness()
                  break
              except NonRetryableSmokeError as error:
                  raise SystemExit(f"Production readiness contract failed: {error}") from error
              except (TransientSmokeError, urllib.error.URLError, TimeoutError, OSError) as error:
                  last_error = f"{type(error).__name__}: {error}"
                  print(f"Readiness attempt {attempt}/{MAX_READINESS_ATTEMPTS}: {last_error}")
                  if attempt < MAX_READINESS_ATTEMPTS:
                      time.sleep(10)
          else:
              raise SystemExit("Production readiness failed after retries: " + last_error)
          
          
          # Verify that lessons and quizzes are protected before authenticating.
          for course_id in TARGETS:
              for resource in ("lesson", "quiz"):
                  route = f"/api/node/{course_id}/{resource}"
                  accept = "text/markdown" if resource == "lesson" else "application/json"
                  code, _ = fetch_retry(
                      anonymous, route, accept, 401, f"anonymous protection {route}"
                  )
                  if code != 401:
                      raise NonRetryableSmokeError(
                          f"Expected protected route {route} to return HTTP 401; got {code}"
                      )
          print(f"PRODUCTION_AUTH_BOUNDARY=passed protected_routes={len(TARGETS) * 2}")
          
          
          # By default this workflow does not attempt a production login.
          if not RUN_AUTHENTICATED:
              print("PRODUCTION_CONTENT_CHECK=skipped; authenticated smoke is not explicitly enabled")
              raise SystemExit(0)
          if not PASSWORD:
              raise SystemExit(
                  "authenticated smoke is enabled but SKILLTREE_PRODUCTION_TEST_PASSWORD is not configured"
              )
          
          # Do not retry login: an ambiguous response should not cause repeated password
          # attempts against production or risk triggering the login rate limit.
          jar = http.cookiejar.CookieJar()
          authenticated = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          try:
              code, login_text = fetch(
                  authenticated,
                  "/api/auth/login",
                  method="POST",
                  body={"password": PASSWORD},
              )
          except (urllib.error.URLError, TimeoutError, OSError) as error:
              raise SystemExit(
                  f"Production login request failed; no retry was attempted ({type(error).__name__})"
              ) from error
          
          login_payload = parse_json_or_fail(login_text, "Production login")
          if code != 200 or login_payload.get("authenticated") is not True:
              raise SystemExit(
                  "Configured production test credential was rejected or login failed; "
                  "no retry was attempted to avoid triggering login rate limiting"
              )
          
          code, session_text = fetch_retry(
              authenticated, "/api/auth/status", "application/json", 200,
              "authenticated session status"
          )
          session_status = parse_json_or_fail(session_text, "Authenticated session status")
          if session_status.get("authenticated") is not True:
              raise SystemExit("Production session was not retained after login")
          
          for course_id in TARGETS:
              code, lesson_text = fetch_retry(
                  authenticated,
                  f"/api/node/{course_id}/lesson",
                  "text/markdown",
                  200,
                  f"{course_id} lesson",
              )
              lesson_text = lesson_text.strip()
              expected_heading = "# " + titles[course_id]
              if len(lesson_text.encode("utf-8")) < 8000 or not lesson_text.startswith(expected_heading):
                  raise NonRetryableSmokeError(
                      f"{course_id} lesson failed content validation: "
                      f"bytes={len(lesson_text.encode('utf-8'))}, expected heading={expected_heading!r}"
                  )
          
              code, quiz_text = fetch_retry(
                  authenticated,
                  f"/api/node/{course_id}/quiz",
                  "application/json",
                  200,
                  f"{course_id} quiz",
              )
              quiz = parse_json_or_fail(quiz_text, f"{course_id} quiz")
              questions = quiz.get("questions")
              if quiz.get("node_id") != course_id or not isinstance(questions, list) or not questions:
                  raise NonRetryableSmokeError(f"{course_id} quiz has no questions or the wrong node_id")
              if course_id in DATA_EXPERTS and len(questions) != 18:
                  raise NonRetryableSmokeError(
                      f"{course_id} expert quiz must contain 18 questions; got {len(questions)}"
                  )
              if any(
                  not isinstance(question, dict)
                  or "answer" in question
                  or "answer_regex" in question
                  for question in questions
              ):
                  raise NonRetryableSmokeError(
                      f"{course_id} quiz has malformed questions or leaks expected answers to the API client"
                  )
              if course_id in DATA_EXPERTS and any(
                  question.get("type") != "qcm"
                  or not isinstance(question.get("choices"), list)
                  or len(question["choices"]) != 4
                  for question in questions
              ):
                  raise NonRetryableSmokeError(
                      f"{course_id} expert quiz must expose QCM questions with exactly four choices"
                  )
          
              print(
                  f"PRODUCTION_COURSE_OK id={course_id} "
                  f"lesson_bytes={len(lesson_text.encode('utf-8'))} quiz_questions={len(questions)}"
              )
          
          print(f"PRODUCTION_CONTENT_CHECK=passed courses={len(TARGETS)}")
          
          PY
