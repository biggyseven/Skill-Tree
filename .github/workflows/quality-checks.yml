name: Skill-Tree quality checks

permissions:
  contents: read

on:
  push:
    branches: ["feature/lab-workspace"]
  pull_request:
    branches: ["main", "feature/lab-workspace", "security/site-hardening-20261027", "test/browser-ui-regression-2026-10-26", "fix/theme-indicator-2026-10-26"]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: skilltree_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d skilltree_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/skilltree_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run API and lab regression tests
        run: python -m unittest discover -s tests -v
      - name: Audit du catalogue pédagogique
        run: python scripts/audit_pedagogical_catalog.py

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/lab-workspace
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/lab-workspace/package-lock.json
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Check inline Skill-Tree dashboard scripts
        run: node ../../scripts/check-dashboard-js.cjs
      - name: Run Lab Workspace unit tests
        run: npm test
      - name: Build Lab Workspace
        run: npm run build
