name: Skill-Tree quality checks

permissions:
  contents: write

on:
  push:
    branches: ["feature/lab-workspace"]
  pull_request:
    branches: ["main", "feature/lab-workspace"]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run API and lab regression tests
        run: python -m unittest discover -s tests -v

  frontend-build:
    runs-on: ubuntu-latest
    # Only one job may publish the generated bundle for a branch at a time.
    concurrency:
      group: lab-workspace-publish-${{ github.ref }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: app/lab-workspace
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/lab-workspace/package-lock.json
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Check inline Skill-Tree dashboard scripts
        run: node ../../scripts/check-dashboard-js.cjs
      - name: Run Lab Workspace unit tests
        run: npm test
      - name: Build Lab Workspace
        run: npm run build
      - name: Publish generated static bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/lab-workspace'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ../../static/lab
          if git diff --cached --quiet; then
            echo "Le bundle statique est déjà à jour."
            exit 0
          fi
          git commit -m "Build Lab Workspace static assets"
          # npm ci modifie le node_modules suivi historiquement dans ce dépôt.
          # Réinitialiser ce répertoire après le build pour que le rebase du bundle
          # ne soit pas bloqué par des changements locaux sans rapport avec le code.
          git restore --worktree -- node_modules
          git clean -fdx -- node_modules
          # Un autre commit peut arriver pendant le build : rebase le bundle sur la tête distante
          # avant le push, plutôt que d'échouer sur un rejet non-fast-forward.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
