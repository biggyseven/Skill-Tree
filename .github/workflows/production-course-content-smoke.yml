name: Production lesson and quiz API smoke

on:
  push:
    branches: ["feature/lab-workspace"]
    paths:
      - ".github/workflows/production-course-content-smoke.yml"
      - "app/api.py"
      - "app/loader.py"
      - "content/nodes.json"
      - "content/lessons/**"
      - "content/quiz/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production-courses:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout catalogue
        uses: actions/checkout@v7

      - name: Verify production authentication and optional authenticated content
        shell: bash
        env:
          SKILLTREE_RUN_AUTHENTICATED_SMOKE: ${{ vars.SKILLTREE_RUN_AUTHENTICATED_SMOKE }}
          SKILLTREE_PRODUCTION_TEST_PASSWORD: ${{ secrets.SKILLTREE_PRODUCTION_TEST_PASSWORD }}
        run: |
          python - <<'PY'
          import http.cookiejar
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          BASE = "https://skill-tree-vjon.onrender.com"
          TARGETS = (
              "maint-communication-debutant",
              "maint-securite-base-debutant",
              "maint-procedures-intermediaire",
              "maint-reporting-incident-intermediaire",
              "maint-predictive-expert",
              "maint-audits-expert",
              "maint-fournisseurs-expert",
              "maint-retex-expert",
              "data-bigdata-expert",
              "data-streaming-expert",
              "data-datalake-expert",
              "data-securite-expert",
              "data-gouvernance-expert",
              "data-ingestion-expert",
          )
          DATA_EXPERTS = frozenset({
              "data-bigdata-expert",
              "data-streaming-expert",
              "data-datalake-expert",
              "data-securite-expert",
              "data-gouvernance-expert",
              "data-ingestion-expert",
          })
          RUN_AUTHENTICATED = os.environ.get("SKILLTREE_RUN_AUTHENTICATED_SMOKE", "").strip().lower() == "true"
          PASSWORD = os.environ.get("SKILLTREE_PRODUCTION_TEST_PASSWORD", "")
          nodes = json.loads(Path("content/nodes.json").read_text(encoding="utf-8-sig"))
          titles = {
              item["id"]: item["title"]
              for item in nodes
              if isinstance(item, dict)
              and isinstance(item.get("id"), str)
              and isinstance(item.get("title"), str)
          }
          missing_catalogue = sorted(set(TARGETS) - set(titles))
          if missing_catalogue:
              raise SystemExit(
                  "Target ids absent from the checked-out catalogue: "
                  + ", ".join(missing_catalogue)
              )

          class NonRetryableSmokeError(Exception):
              pass

          def fetch(opener, path, accept="application/json", method="GET", body=None):
              headers = {
                  "Accept": accept,
                  "User-Agent": "Skill-Tree-production-smoke",
              }
              data = None
              if body is not None:
                  data = json.dumps(body).encode("utf-8")
                  headers["Content-Type"] = "application/json"
              request = urllib.request.Request(BASE + path, data=data, headers=headers, method=method)
              try:
                  with opener.open(request, timeout=15) as response:
                      return response.status, response.read().decode("utf-8", errors="replace")
              except urllib.error.HTTPError as error:
                  return error.code, error.read().decode("utf-8", errors="replace")

          def verify():
              anonymous = urllib.request.build_opener()
              status, _ = fetch(anonymous, "/openapi.json")
              if status != 200:
                  raise RuntimeError(f"OpenAPI readiness returned HTTP {status}")

              status, auth_text = fetch(anonymous, "/api/auth/status")
              if status != 200:
                  raise RuntimeError(f"Authentication status returned HTTP {status}")
              auth_status = json.loads(auth_text)
              if auth_status.get("required") is not True or auth_status.get("authenticated") is not False:
                  raise RuntimeError("Production does not report the expected private, unauthenticated state")

              # Lesson and quiz content must not be exposed without a signed session.
              for course_id in TARGETS:
                  for resource in ("lesson", "quiz"):
                      route = f"/api/node/{course_id}/{resource}"
                      accept = "text/markdown" if resource == "lesson" else "application/json"
                      code, body = fetch(anonymous, route, accept)
                      if code != 401:
                          raise RuntimeError(
                              f"Expected protected route {route} to return HTTP 401; got {code} "
                              f"(body bytes={len(body.encode('utf-8'))})"
                          )
              print(f"PRODUCTION_AUTH_BOUNDARY=passed protected_routes={len(TARGETS) * 2}")

              # By default this workflow does not attempt a production login.
              # Enable explicitly only after setting a valid test credential in GitHub Actions secrets.
              if not RUN_AUTHENTICATED:
                  print("PRODUCTION_CONTENT_CHECK=skipped; authenticated smoke is not explicitly enabled")
                  return
              if not PASSWORD:
                  raise NonRetryableSmokeError(
                      "authenticated smoke is enabled but SKILLTREE_PRODUCTION_TEST_PASSWORD is not configured"
                  )

              jar = http.cookiejar.CookieJar()
              authenticated = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
              code, login_text = fetch(
                  authenticated,
                  "/api/auth/login",
                  method="POST",
                  body={"password": PASSWORD},
              )
              try:
                  login_payload = json.loads(login_text)
              except json.JSONDecodeError:
                  login_payload = {}
              if code != 200 or login_payload.get("authenticated") is not True:
                  raise NonRetryableSmokeError(
                      "Configured production test credential was rejected; "
                      "no retry was attempted to avoid triggering login rate limiting"
                  )
              code, session_text = fetch(authenticated, "/api/auth/status")
              if code != 200 or json.loads(session_text).get("authenticated") is not True:
                  raise NonRetryableSmokeError("Production session was not retained after login")

              for course_id in TARGETS:
                  code, lesson_text = fetch(
                      authenticated, f"/api/node/{course_id}/lesson", "text/markdown"
                  )
                  lesson_text = lesson_text.strip()
                  expected_heading = "# " + titles[course_id]
                  if code != 200 or len(lesson_text.encode("utf-8")) < 8000 or not lesson_text.startswith(expected_heading):
                      raise RuntimeError(
                          f"{course_id} lesson failed: HTTP {code}, "
                          f"bytes={len(lesson_text.encode('utf-8'))}, expected heading={expected_heading!r}"
                      )

                  code, quiz_text = fetch(
                      authenticated, f"/api/node/{course_id}/quiz", "application/json"
                  )
                  if code != 200:
                      raise RuntimeError(f"{course_id} quiz returned HTTP {code}")
                  try:
                      quiz = json.loads(quiz_text)
                  except json.JSONDecodeError as error:
                      raise RuntimeError(f"{course_id} quiz did not return valid JSON") from error
                  questions = quiz.get("questions")
                  if quiz.get("node_id") != course_id or not isinstance(questions, list) or not questions:
                      raise RuntimeError(f"{course_id} quiz has no questions or the wrong node_id")
                  if course_id in DATA_EXPERTS and len(questions) != 18:
                      raise RuntimeError(
                          f"{course_id} expert quiz must contain 18 questions; got {len(questions)}"
                      )
                  if any(
                      "answer" in question or "answer_regex" in question
                      for question in questions if isinstance(question, dict)
                  ):
                      raise RuntimeError(f"{course_id} quiz leaks expected answers to the API client")
                  print(
                      f"PRODUCTION_COURSE_OK id={course_id} "
                      f"lesson_bytes={len(lesson_text.encode('utf-8'))} quiz_questions={len(questions)}"
                  )
              print(f"PRODUCTION_CONTENT_CHECK=passed courses={len(TARGETS)}")

          last_error = "production did not respond"
          # Retry transient readiness errors only; a bad credential is always non-retryable.
          for attempt in range(1, 19):
              try:
                  verify()
                  break
              except NonRetryableSmokeError as error:
                  raise SystemExit(f"Production authenticated smoke stopped: {error}") from error
              except Exception as error:
                  last_error = f"{type(error).__name__}: {error}"
                  print(f"Readiness attempt {attempt}/18: {last_error}")
                  if attempt < 18:
                      time.sleep(10)
          else:
              raise SystemExit("Production lesson/authentication smoke failed after retries: " + last_error)
          PY
