name: Production Lab Workspace persistence smoke

on:
  push:
    branches:
      - feature/lab-workspace
    paths:
      - .github/workflows/production-lab-persistence-smoke.yml
      - labs_v2/**
      - app/lab_routes.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-topology-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for production API
        shell: bash
        run: |
          python - <<'PY'
          import time
          import urllib.request

          base = "https://skill-tree-vjon.onrender.com"
          last_error = "production API did not become ready"
          for _ in range(18):
              try:
                  with urllib.request.urlopen(base + "/openapi.json", timeout=15) as response:
                      if response.status == 200:
                          print("Production API is responding.")
                          break
                      last_error = f"HTTP {response.status}"
              except Exception as error:
                  last_error = str(error)
              time.sleep(5)
          else:
              raise SystemExit(f"Production API unavailable: {last_error}")
          PY

      - name: Verify the Linux intermediate lab is exposed with a playable v2 topology
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          base = "https://skill-tree-vjon.onrender.com"
          path = "/api/lab/v2/reseau-linux-intermediaire"
          last_error = "scenario not yet deployed"
          for _ in range(36):
              try:
                  with urllib.request.urlopen(base + path, timeout=25) as response:
                      payload = json.loads(response.read().decode("utf-8"))
                  topology = payload.get("initial_topology") or {}
                  definition = payload.get("definition") or {}
                  rules = (definition.get("check") or {}).get("rules") or []
                  if (
                      payload.get("id") == "reseau-linux-intermediaire"
                      and payload.get("sandbox") is not True
                      and len(topology.get("nodes") or []) >= 5
                      and len(topology.get("links") or []) >= 4
                      and len(rules) >= 9
                  ):
                      print("PRODUCTION_LINUX_LAB=available")
                      print("EQUIPMENT_COUNT=" + str(len(topology["nodes"])))
                      print("CABLE_COUNT=" + str(len(topology["links"])))
                      print("AUTOMATED_RULE_COUNT=" + str(len(rules)))
                      break
                  last_error = "API response lacks the expected playable v2 topology"
              except urllib.error.HTTPError as error:
                  detail = error.read().decode("utf-8", errors="replace")
                  last_error = f"HTTP {error.code}: {detail[:400]}"
              except Exception as error:
                  last_error = str(error)
              time.sleep(5)
          else:
              raise SystemExit(
                  "Production Linux scenario did not become available after deployment: "
                  + last_error
              )
          PY

      - name: Save and reload a uniquely named production smoke topology
        shell: bash
        env:
          SMOKE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          base = "https://skill-tree-vjon.onrender.com"
          # The run-specific id is deliberately not a real course/lab id. This avoids
          # overwriting users' topology snapshots. The API has no delete endpoint, so
          # the one labelled smoke snapshot is left as an auditable test record.
          lab_id = "production-persistence-smoke-" + os.environ["SMOKE_RUN_ID"]
          topology = {
              "schema_version": 2,
              "topology_id": lab_id,
              "metadata": {
                  "name": lab_id,
                  "author": "github-actions-smoke-test",
                  "created_at": "2026-10-27T00:00:00Z",
                  "mode": "lab",
              },
              "nodes": [
                  {
                      "id": "SMOKE-R1",
                      "type": "router",
                      "x": 120,
                      "y": 180,
                      "label": "SMOKE-R1",
                      "ports": [
                          {
                              "id": "Fa0/0",
                              "name": "Fa0/0",
                              "state": "up",
                              "ip": "10.254.254.1",
                              "mask": "255.255.255.252",
                          }
                      ],
                      "config": {"hostname": "SMOKE-R1"},
                  }
              ],
              "links": [],
              "simulation": {"state": "idle", "event_log": []},
          }

          def request_json(path, method="GET", body=None):
              data = None if body is None else json.dumps(body, separators=(",", ":")).encode("utf-8")
              headers = {} if data is None else {"Content-Type": "application/json"}
              request = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as error:
                  detail = error.read().decode("utf-8", errors="replace")
                  raise SystemExit(f"{method} {path} returned HTTP {error.code}: {detail}") from error

          saved = request_json(
              f"/api/lab/v2/{lab_id}/save",
              method="POST",
              body={"topology": topology},
          )
          assert saved.get("success") is True, saved
          backend = saved.get("storage_backend")
          assert backend == "postgresql", (
              "Production save did not confirm PostgreSQL/Neon: "
              + json.dumps(saved, ensure_ascii=False)
          )

          loaded = request_json(f"/api/lab/v2/{lab_id}/load")
          assert loaded.get("topology") == topology, (
              "Loaded topology differs from the saved topology: "
              + json.dumps({"saved": topology, "loaded": loaded}, ensure_ascii=False)
          )
          assert loaded.get("lab_id") == lab_id, loaded
          print("PRODUCTION_TOPOLOGY_PERSISTENCE=passed")
          print("STORAGE_BACKEND=postgresql")
          print("ROUND_TRIP=exact")
          print("SMOKE_LAB_ID=" + lab_id)
          PY
