name: Browser UI regressions

on:
  pull_request:
    branches: ["main", "feature/lab-workspace", "test/browser-ui-regression-2026-10-26", "fix/theme-indicator-2026-10-26"]
    paths:
      - "static/**"
      - "app/**"
      - "content/**"
      - "tests/e2e/**"
      - "requirements.txt"
      - ".github/workflows/browser-ui-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Diagnostic ponctuel de l’API Lab Workspace déployée
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/course-navigation-new-tabs-2026-10-26'
        continue-on-error: true
        run: |
          set +e
          for lab_id in acl-debutant; do
            response_file="$(mktemp)"
            http_status="$(curl -L -sS --connect-timeout 10 --max-time 180 -o "$response_file" -w "%{http_code}" "https://skill-tree-vjon.onrender.com/api/lab/v2/$lab_id")"
            curl_exit=$?
            echo "ENDPOINT=/api/lab/v2/$lab_id"
            echo "CURL_EXIT=$curl_exit HTTP_STATUS=${http_status:-000}"
            python - "$response_file" <<'PY'
          import json, sys
          from pathlib import Path
          raw = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          try:
              data = json.loads(raw)
              definition = data.get("definition") if isinstance(data.get("definition"), dict) else {}
              topology = data.get("initial_topology") if isinstance(data.get("initial_topology"), dict) else {}
              summary = {
                  "id": data.get("id"),
                  "schema_version": data.get("schema_version"),
                  "sandbox": data.get("sandbox"),
                  "course_locked": data.get("course_locked"),
                  "course_lock_message": data.get("course_lock_message"),
                  "title": definition.get("title"),
                  "topology_nodes": len(topology.get("nodes") or []),
                  "topology_links": len(topology.get("links") or []),
                  "detail": data.get("detail"),
              }
              print(json.dumps(summary, ensure_ascii=False))
          except Exception:
              print("RESPONSE_BODY=" + raw[:4000])
          PY
            rm -f "$response_file"
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install application dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Lab Workspace dependencies
        run: npm ci --prefix app/lab-workspace --no-audit --no-fund

      - name: Build Lab Workspace for browser tests
        run: npm --prefix app/lab-workspace run build

      - name: Install Playwright test runner
        run: npm install --prefix tests/e2e --no-audit --no-fund

      - name: Install Chromium and OS dependencies
        run: tests/e2e/node_modules/.bin/playwright install chromium

      - name: Run browser UI regression suite
        run: npm --prefix tests/e2e test

      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-ui-test-results
          path: tests/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
