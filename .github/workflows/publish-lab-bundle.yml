name: Publish Lab Workspace bundle

on:
  push:
    branches: ["feature/lab-workspace"]
    paths:
      - "app/lab-workspace/**"
      - "static/lab/**"
      - ".github/workflows/publish-lab-bundle.yml"

permissions:
  contents: read

concurrency:
  group: lab-workspace-publish-feature-lab-workspace
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app/lab-workspace
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/lab-workspace/package-lock.json
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Build Lab Workspace
        run: npm run build
      - name: Publish generated static bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ../../static/lab
          if git diff --cached --quiet; then
            echo "Le bundle statique est déjà à jour."
            exit 0
          fi
          git commit -m "Build Lab Workspace static assets"
          # npm ci modifie le node_modules suivi historiquement dans ce dépôt.
          git restore --worktree -- node_modules
          git clean -fdx -- node_modules
          # Réconcilier le build avec les commits arrivés pendant sa compilation.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
