name: Production Lab Workspace persistence smoke

on:
  push:
    branches:
      - feature/lab-workspace
    paths:
      - .github/workflows/production-lab-persistence-smoke.yml
      - labs_v2/**
      - app/lab_routes.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-topology-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for production API
        shell: bash
        run: |
          python - <<'PY'
          import time
          import urllib.request

          base = "https://skill-tree-vjon.onrender.com"
          last_error = "production API did not become ready"
          for _ in range(18):
              try:
                  with urllib.request.urlopen(base + "/openapi.json", timeout=15) as response:
                      if response.status == 200:
                          print("Production API is responding.")
                          break
                      last_error = f"HTTP {response.status}"
              except Exception as error:
                  last_error = str(error)
              time.sleep(5)
          else:
              raise SystemExit(f"Production API unavailable: {last_error}")
          PY

      - name: Checkout catalogue for production lab coverage audit
        uses: actions/checkout@v4

      - name: Audit all catalogue courses that require a Lab Workspace scenario
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          base = "https://skill-tree-vjon.onrender.com"
          nodes = json.loads(Path("content/nodes.json").read_text(encoding="utf-8-sig"))
          required = {
              item["id"]: item
              for item in nodes
              if isinstance(item, dict)
              and isinstance(item.get("id"), str)
              and any(
                  isinstance(requirement, dict) and requirement.get("kind") == "lab"
                  for requirement in (item.get("requirements") or [])
              )
          }
          last_error = "catalog endpoint did not become available"
          for _ in range(24):
              try:
                  request = urllib.request.Request(base + "/api/lab/v2", headers={"Accept": "application/json"})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      playable = json.loads(response.read().decode("utf-8"))
                  if isinstance(playable, list):
                      break
                  last_error = "unexpected JSON shape from /api/lab/v2"
              except Exception as error:
                  last_error = str(error)
                  time.sleep(5)
          else:
              raise SystemExit("Cannot audit production lab catalog: " + last_error)

          available = {
              item.get("id"): item
              for item in playable
              if isinstance(item, dict) and isinstance(item.get("id"), str)
          }
          missing = sorted(set(required) - set(available))
          print("PRODUCTION_LAB_CATALOG_AUDIT_BEGIN")
          print("COURSES_TOTAL=" + str(len(nodes)))
          print("COURSES_REQUIRING_LAB=" + str(len(required)))
          print("PLAYABLE_V2_LABS_API=" + str(len(available)))
          print("REQUIRED_LABS_MISSING_FROM_PLAYABLE_CATALOG=" + str(len(missing)))
          for lab_id in missing:
              node = required[lab_id]
              print(
                  "MISSING_LAB="
                  + json.dumps(
                      {
                          "id": lab_id,
                          "title": node.get("title", ""),
                          "module": node.get("module", ""),
                          "category": node.get("category", ""),
                      },
                      ensure_ascii=False,
                      separators=(",", ":"),
                  )
              )
          print("PRODUCTION_LAB_CATALOG_AUDIT_END")
          PY

      - name: Verify new network and security labs are playable after deployment
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          base = "https://skill-tree-vjon.onrender.com"
          expected = [
              "nat-debutant",
              "ipv6-intermediaire",
              "stp-intermediaire",
              "stp-expert",
              "bgp-intermediaire",
              "bgp-expert",
              "eigrp-intermediaire",
              "eigrp-expert",
              "dhcp-dns-intermediaire",
              "dhcp-dns-expert",
              "secu-l2-expert",
              "zero-trust-intermediaire",
              "zero-trust-expert",
          ]

          def get_json(path):
              request = urllib.request.Request(base + path, headers={"Accept": "application/json"})
              with urllib.request.urlopen(request, timeout=25) as response:
                  return json.loads(response.read().decode("utf-8"))

          last_error = "the latest scenario files are not in the live API yet"
          for _ in range(36):
              try:
                  catalog = get_json("/api/lab/v2")
                  available = {
                      item.get("id"): item
                      for item in catalog
                      if isinstance(item, dict) and isinstance(item.get("id"), str)
                  }
                  missing = sorted(set(expected) - set(available))
                  if not missing:
                      break
                  last_error = "labs not yet exposed: " + ", ".join(missing)
              except Exception as error:
                  last_error = str(error)
              time.sleep(5)
          else:
              raise SystemExit("Lab Workspace catalog has not caught up with deployment: " + last_error)

          for lab_id in expected:
              try:
                  payload = get_json("/api/lab/v2/" + lab_id)
              except Exception as error:
                  raise SystemExit(f"{lab_id}: GET failed: {error}") from error
              topology = payload.get("initial_topology") or {}
              definition = payload.get("definition") or {}
              check = definition.get("check") or {}
              rules = check.get("rules") or []
              nodes = topology.get("nodes") or []
              links = topology.get("links") or []
              if (
                  payload.get("id") != lab_id
                  or payload.get("sandbox") is True
                  or len(nodes) < 2
                  or len(links) < 1
                  or check.get("type") != "config_assertions"
                  or len(rules) < 3
              ):
                  raise SystemExit(
                      f"{lab_id}: not a playable, gradeable lab; "
                      + json.dumps(
                          {"sandbox": payload.get("sandbox"), "nodes": len(nodes),
                           "links": len(links), "check_type": check.get("type"),
                           "rules": len(rules)}, ensure_ascii=False
                      )
                  )
              print(
                  f"PLAYABLE_LAB={lab_id} EQUIPMENT={len(nodes)} "
                  f"CABLES={len(links)} RULES={len(rules)}"
              )
          print("NEW_LAB_BATCH_PRODUCTION_CHECK=passed")
          PY

      - name: Save and reload a uniquely named production smoke topology
        shell: bash
        env:
          SMOKE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          base = "https://skill-tree-vjon.onrender.com"
          # The run-specific id is deliberately not a real course/lab id. This avoids
          # overwriting users' topology snapshots. The API has no delete endpoint, so
          # the one labelled smoke snapshot is left as an auditable test record.
          lab_id = "production-persistence-smoke-" + os.environ["SMOKE_RUN_ID"]
          topology = {
              "schema_version": 2,
              "topology_id": lab_id,
              "metadata": {
                  "name": lab_id,
                  "author": "github-actions-smoke-test",
                  "created_at": "2026-10-27T00:00:00Z",
                  "mode": "lab",
              },
              "nodes": [
                  {
                      "id": "SMOKE-R1",
                      "type": "router",
                      "x": 120,
                      "y": 180,
                      "label": "SMOKE-R1",
                      "ports": [
                          {
                              "id": "Fa0/0",
                              "name": "Fa0/0",
                              "state": "up",
                              "ip": "10.254.254.1",
                              "mask": "255.255.255.252",
                          }
                      ],
                      "config": {"hostname": "SMOKE-R1"},
                  }
              ],
              "links": [],
              "simulation": {"state": "idle", "event_log": []},
          }

          def request_json(path, method="GET", body=None):
              data = None if body is None else json.dumps(body, separators=(",", ":")).encode("utf-8")
              headers = {} if data is None else {"Content-Type": "application/json"}
              request = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as error:
                  detail = error.read().decode("utf-8", errors="replace")
                  raise SystemExit(f"{method} {path} returned HTTP {error.code}: {detail}") from error

          saved = request_json(
              f"/api/lab/v2/{lab_id}/save",
              method="POST",
              body={"topology": topology},
          )
          assert saved.get("success") is True, saved
          backend = saved.get("storage_backend")
          assert backend == "postgresql", (
              "Production save did not confirm PostgreSQL/Neon: "
              + json.dumps(saved, ensure_ascii=False)
          )

          loaded = request_json(f"/api/lab/v2/{lab_id}/load")
          assert loaded.get("topology") == topology, (
              "Loaded topology differs from the saved topology: "
              + json.dumps({"saved": topology, "loaded": loaded}, ensure_ascii=False)
          )
          assert loaded.get("lab_id") == lab_id, loaded
          print("PRODUCTION_TOPOLOGY_PERSISTENCE=passed")
          print("STORAGE_BACKEND=postgresql")
          print("ROUND_TRIP=exact")
          print("SMOKE_LAB_ID=" + lab_id)
          PY
