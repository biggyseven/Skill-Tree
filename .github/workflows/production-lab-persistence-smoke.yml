name: Production Lab Workspace read-only audit

on:
  push:
    branches:
      - feature/lab-workspace
    paths:
      - .github/workflows/production-lab-persistence-smoke.yml
      - labs_v2/**
      - app/lab_routes.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-lab-read-only-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for production API (read-only)
        shell: bash
        run: |
          python - <<'PY'
          import time
          import urllib.request

          base = "https://skill-tree-vjon.onrender.com"
          last_error = "production API did not become ready"
          for _ in range(18):
              try:
                  with urllib.request.urlopen(base + "/openapi.json", timeout=15) as response:
                      if response.status == 200:
                          print("Production API is responding.")
                          break
                      last_error = f"HTTP {response.status}"
              except Exception as error:
                  last_error = str(error)
              time.sleep(5)
          else:
              raise SystemExit(f"Production API unavailable: {last_error}")
          PY

      - name: Checkout catalogue for production lab coverage audit
        uses: actions/checkout@v7

      - name: Audit all catalogue courses that require a Lab Workspace scenario
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          base = "https://skill-tree-vjon.onrender.com"
          nodes = json.loads(Path("content/nodes.json").read_text(encoding="utf-8-sig"))
          required = {
              item["id"]: item
              for item in nodes
              if isinstance(item, dict)
              and isinstance(item.get("id"), str)
              and any(
                  isinstance(requirement, dict) and requirement.get("kind") == "lab"
                  for requirement in (item.get("requirements") or [])
              )
          }
          last_error = "catalog endpoint did not become available"
          for _ in range(24):
              try:
                  request = urllib.request.Request(base + "/api/lab/v2", headers={"Accept": "application/json"})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      playable = json.loads(response.read().decode("utf-8"))
                  if isinstance(playable, list):
                      break
                  last_error = "unexpected JSON shape from /api/lab/v2"
              except Exception as error:
                  last_error = str(error)
                  time.sleep(5)
          else:
              raise SystemExit("Cannot audit production lab catalog: " + last_error)

          available = {
              item.get("id"): item
              for item in playable
              if isinstance(item, dict) and isinstance(item.get("id"), str)
          }
          missing = sorted(set(required) - set(available))
          print("PRODUCTION_LAB_CATALOG_AUDIT_BEGIN")
          print("COURSES_TOTAL=" + str(len(nodes)))
          print("COURSES_REQUIRING_LAB=" + str(len(required)))
          print("PLAYABLE_V2_LABS_API=" + str(len(available)))
          print("REQUIRED_LABS_MISSING_FROM_PLAYABLE_CATALOG=" + str(len(missing)))
          for lab_id in missing:
              node = required[lab_id]
              print(
                  "MISSING_LAB="
                  + json.dumps(
                      {
                          "id": lab_id,
                          "title": node.get("title", ""),
                          "module": node.get("module", ""),
                          "category": node.get("category", ""),
                      },
                      ensure_ascii=False,
                      separators=(",", ":"),
                  )
              )
          print("PRODUCTION_LAB_CATALOG_AUDIT_END")
          PY

      - name: Verify new network and security labs are playable after deployment
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          base = "https://skill-tree-vjon.onrender.com"
          expected = [
              "nat-debutant",
              "ipv6-intermediaire",
              "stp-intermediaire",
              "stp-expert",
              "bgp-intermediaire",
              "bgp-expert",
              "eigrp-intermediaire",
              "eigrp-expert",
              "dhcp-dns-intermediaire",
              "dhcp-dns-expert",
              "secu-l2-expert",
              "zero-trust-intermediaire",
              "zero-trust-expert",
          ]

          def get_json(path):
              request = urllib.request.Request(base + path, headers={"Accept": "application/json"})
              with urllib.request.urlopen(request, timeout=25) as response:
                  return json.loads(response.read().decode("utf-8"))

          last_error = "the latest scenario files are not in the live API yet"
          for _ in range(36):
              try:
                  catalog = get_json("/api/lab/v2")
                  available = {
                      item.get("id"): item
                      for item in catalog
                      if isinstance(item, dict) and isinstance(item.get("id"), str)
                  }
                  missing = sorted(set(expected) - set(available))
                  if not missing:
                      break
                  last_error = "labs not yet exposed: " + ", ".join(missing)
              except Exception as error:
                  last_error = str(error)
              time.sleep(5)
          else:
              raise SystemExit("Lab Workspace catalog has not caught up with deployment: " + last_error)

          for lab_id in expected:
              try:
                  payload = get_json("/api/lab/v2/" + lab_id)
              except Exception as error:
                  raise SystemExit(f"{lab_id}: GET failed: {error}") from error
              topology = payload.get("initial_topology") or {}
              definition = payload.get("definition") or {}
              check = definition.get("check") or {}
              rules = check.get("rules") or []
              nodes = topology.get("nodes") or []
              links = topology.get("links") or []
              if (
                  payload.get("id") != lab_id
                  or payload.get("sandbox") is True
                  or len(nodes) < 2
                  or len(links) < 1
                  or check.get("type") != "config_assertions"
                  or len(rules) < 3
              ):
                  raise SystemExit(
                      f"{lab_id}: not a playable, gradeable lab; "
                      + json.dumps(
                          {"sandbox": payload.get("sandbox"), "nodes": len(nodes),
                           "links": len(links), "check_type": check.get("type"),
                           "rules": len(rules)}, ensure_ascii=False
                      )
                  )
              print(
                  f"PLAYABLE_LAB={lab_id} EQUIPMENT={len(nodes)} "
                  f"CABLES={len(links)} RULES={len(rules)}"
              )
          print("NEW_LAB_BATCH_PRODUCTION_CHECK=passed")
          PY

