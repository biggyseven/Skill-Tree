name: Exam API regression

on:
  push:
    branches: ["fix/exams-api-workflow-20261028"]
    paths:
      - "app/api.py"
      - "app/db.py"
      - "app/domain.py"
      - "app/engine.py"
      - "tests/test_exam_workflow.py"
      - ".github/workflows/exam-regression.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "app/api.py"
      - "app/db.py"
      - "app/domain.py"
      - "app/engine.py"
      - "tests/test_exam_workflow.py"
      - ".github/workflows/exam-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exam-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Run exam workflow regression tests
        run: python -m unittest discover -s tests -p "test_exam_workflow.py" -v
